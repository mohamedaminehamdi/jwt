services:
  mongo:
    image: mongo:6
    ports:
      - '27017:27017'
    volumes:
      - mongo-data:/data/db

  app:
    build: .
    ports:
      - '3000:3000'
    environment:
      MONGO_URI: mongodb://mongo:27017/jobs
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      JWT_LIFETIME: ${JWT_LIFETIME:-30d}
    depends_on:
      - mongo

volumes:
  mongo-data:
