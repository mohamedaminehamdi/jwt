<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jobs Tracker</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main>
      <section id="auth-section" hidden>
        <form class="form auth-form" id="auth-form">
          <h5 id="auth-title">login</h5>
          <div class="form-row" id="name-row" hidden>
            <label for="name" class="form-label">name</label>
            <input type="text" id="name" name="name" class="form-input" autocomplete="name" />
          </div>
          <div class="form-row">
            <label for="email" class="form-label">email</label>
            <input type="email" id="email" name="email" class="form-input" autocomplete="email" required />
          </div>
          <div class="form-row">
            <label for="password" class="form-label">password</label>
            <input type="password" id="password" name="password" class="form-input" autocomplete="current-password" required />
          </div>
          <p class="alert" id="auth-alert" role="alert" hidden></p>
          <button type="submit" class="btn btn-block" id="auth-submit">login</button>
          <p class="toggle-text">
            <button type="button" class="link-btn" id="auth-toggle">create an account</button>
          </p>
        </form>
      </section>

      <section class="dashboard" id="dashboard" hidden>
        <header class="dashboard-header">
          <h4>Hello, <span id="user-name"></span></h4>
          <button type="button" class="btn btn-hipster" id="logout">logout</button>
        </header>

        <details class="account" id="account">
          <summary>account settings</summary>
          <p class="alert" id="account-alert" role="alert" hidden></p>
          <div class="account-grid">
            <form id="profile-form">
              <h5>profile</h5>
              <div class="form-row">
                <label for="profile-name" class="form-label">name</label>
                <input type="text" id="profile-name" name="name" class="form-input" autocomplete="name" required />
              </div>
              <div class="form-row">
                <label for="profile-email" class="form-label">email</label>
                <input type="email" id="profile-email" name="email" class="form-input" autocomplete="email" required />
              </div>
              <div class="form-row">
                <label for="profile-location" class="form-label">location</label>
                <input type="text" id="profile-location" name="location" class="form-input" />
              </div>
              <button type="submit" class="btn">save profile</button>
            </form>
            <form id="password-form">
              <h5>password</h5>
              <div class="form-row">
                <label for="current-password" class="form-label">current password</label>
                <input type="password" id="current-password" name="currentPassword" class="form-input" autocomplete="current-password" required />
              </div>
              <div class="form-row">
                <label for="new-password" class="form-label">new password</label>
                <input type="password" id="new-password" name="newPassword" class="form-input" autocomplete="new-password" minlength="8" aria-describedby="password-hint" required />
                <p class="form-hint" id="password-hint">At least 8 characters with a letter and a number.</p>
              </div>
              <button type="submit" class="btn">change password</button>
            </form>
            <form id="delete-form">
              <h5>delete account</h5>
              <p class="form-hint">This removes your account and all your jobs. It cannot be undone.</p>
              <div class="form-row">
                <label for="delete-password" class="form-label">password</label>
                <input type="password" id="delete-password" name="password" class="form-input" autocomplete="current-password" required />
              </div>
              <button type="submit" class="btn btn-danger">delete account</button>
            </form>
          </div>
        </details>

        <section class="stats" aria-label="stats">
          <div class="stat stat-pending">
            <span class="stat-count" id="stat-pending">0</span>
            <span class="stat-label">pending</span>
          </div>
          <div class="stat stat-interview">
            <span class="stat-count" id="stat-interview">0</span>
            <span class="stat-label">interviews</span>
          </div>
          <div class="stat stat-declined">
            <span class="stat-count" id="stat-declined">0</span>
            <span class="stat-label">declined</span>
          </div>
        </section>
        <ul class="monthly" id="monthly"></ul>

        <form class="form job-form" id="job-form">
          <h5 id="job-form-title">add job</h5>
          <div class="form-grid">
            <div class="form-row">
              <label for="position" class="form-label">position</label>
              <input type="text" id="position" name="position" class="form-input" required />
            </div>
            <div class="form-row">
              <label for="company" class="form-label">company</label>
              <input type="text" id="company" name="company" class="form-input" required />
            </div>
            <div class="form-row">
              <label for="jobLocation" class="form-label">location</label>
              <input type="text" id="jobLocation" name="jobLocation" class="form-input" />
            </div>
            <div class="form-row">
              <label for="status" class="form-label">status</label>
              <select id="status" name="status" class="form-input">
                <option value="pending">pending</option>
                <option value="interview">interview</option>
                <option value="declined">declined</option>
              </select>
            </div>
            <div class="form-row">
              <label for="jobType" class="form-label">job type</label>
              <select id="jobType" name="jobType" class="form-input">
                <option value="full-time">full-time</option>
                <option value="part-time">part-time</option>
                <option value="remote">remote</option>
                <option value="internship">internship</option>
              </select>
            </div>
            <div class="form-row">
              <label for="salaryMin" class="form-label">min salary</label>
              <input type="number" id="salaryMin" name="salaryMin" class="form-input" min="0" />
            </div>
            <div class="form-row">
              <label for="salaryMax" class="form-label">max salary</label>
              <input type="number" id="salaryMax" name="salaryMax" class="form-input" min="0" />
            </div>
            <div class="form-row">
              <label for="link" class="form-label">job posting link</label>
              <input type="url" id="link" name="link" class="form-input" placeholder="https://" />
            </div>
            <div class="form-row form-row-wide">
              <label for="notes" class="form-label">notes</label>
              <textarea id="notes" name="notes" class="form-input form-textarea" maxlength="1000"></textarea>
            </div>
          </div>
          <p class="alert" id="job-alert" role="alert" hidden></p>
          <div class="form-actions">
            <button type="submit" class="btn" id="job-submit">add job</button>
            <button type="button" class="btn btn-hipster" id="job-cancel" hidden>cancel</button>
          </div>
        </form>

        <form class="filters" id="filters">
          <div class="form-row">
            <label for="search" class="form-label">search position or company</label>
            <input type="search" id="search" name="search" class="form-input" />
          </div>
          <div class="form-row">
            <label for="filter-status" class="form-label">status</label>
            <select id="filter-status" name="status" class="form-input">
              <option value="all">all</option>
              <option value="pending">pending</option>
              <option value="interview">interview</option>
              <option value="declined">declined</option>
            </select>
          </div>
          <div class="form-row">
            <label for="filter-type" class="form-label">job type</label>
            <select id="filter-type" name="jobType" class="form-input">
              <option value="all">all</option>
              <option value="full-time">full-time</option>
              <option value="part-time">part-time</option>
              <option value="remote">remote</option>
              <option value="internship">internship</option>
            </select>
          </div>
          <div class="form-row">
            <label for="sort" class="form-label">sort</label>
            <select id="sort" name="sort" class="form-input">
              <option value="latest">latest</option>
              <option value="oldest">oldest</option>
              <option value="a-z">a-z</option>
              <option value="z-a">z-a</option>
            </select>
          </div>
          <div class="form-row">
            <label for="filter-from" class="form-label">added from</label>
            <input type="date" id="filter-from" name="from" class="form-input" />
          </div>
          <div class="form-row">
            <label for="filter-to" class="form-label">added to</label>
            <input type="date" id="filter-to" name="to" class="form-input" />
          </div>
          <button type="reset" class="btn btn-hipster">clear filters</button>
          <button type="button" class="btn" id="export">export CSV</button>
        </form>

        <p class="jobs-count" id="jobs-count"></p>
        <ul class="jobs" id="jobs-list"></ul>
        <nav class="pagination" id="pagination" aria-label="pagination" hidden>
          <button type="button" class="btn btn-hipster" id="prev-page">prev</button>
          <span id="page-info"></span>
          <button type="button" class="btn btn-hipster" id="next-page">next</button>
        </nav>
      </section>
    </main>
    <script src="./browser-app.js"></script>
  </body>
</html>
