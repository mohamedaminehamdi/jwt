<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jobs Tracker</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main>
      <section id="auth-section" hidden>
        <form class="form auth-form" id="auth-form">
          <h5 id="auth-title">login</h5>
          <div class="form-row" id="name-row" hidden>
            <label for="name" class="form-label">name</label>
            <input type="text" id="name" name="name" class="form-input" autocomplete="name" />
          </div>
          <div class="form-row">
            <label for="email" class="form-label">email</label>
            <input type="email" id="email" name="email" class="form-input" autocomplete="email" required />
          </div>
          <div class="form-row">
            <label for="password" class="form-label">password</label>
            <input type="password" id="password" name="password" class="form-input" autocomplete="current-password" minlength="6" required />
          </div>
          <p class="alert" id="auth-alert" role="alert" hidden></p>
          <button type="submit" class="btn btn-block" id="auth-submit">login</button>
          <p class="toggle-text">
            <button type="button" class="link-btn" id="auth-toggle">create an account</button>
          </p>
        </form>
      </section>

      <section class="dashboard" id="dashboard" hidden>
        <header class="dashboard-header">
          <h4>Hello, <span id="user-name"></span></h4>
        </header>

        <form class="form job-form" id="job-form">
          <h5 id="job-form-title">add job</h5>
          <div class="form-grid">
            <div class="form-row">
              <label for="position" class="form-label">position</label>
              <input type="text" id="position" name="position" class="form-input" required />
            </div>
            <div class="form-row">
              <label for="company" class="form-label">company</label>
              <input type="text" id="company" name="company" class="form-input" required />
            </div>
            <div class="form-row">
              <label for="jobLocation" class="form-label">location</label>
              <input type="text" id="jobLocation" name="jobLocation" class="form-input" />
            </div>
            <div class="form-row">
              <label for="status" class="form-label">status</label>
              <select id="status" name="status" class="form-input">
                <option value="pending">pending</option>
                <option value="interview">interview</option>
                <option value="declined">declined</option>
              </select>
            </div>
            <div class="form-row">
              <label for="jobType" class="form-label">job type</label>
              <select id="jobType" name="jobType" class="form-input">
                <option value="full-time">full-time</option>
                <option value="part-time">part-time</option>
                <option value="remote">remote</option>
                <option value="internship">internship</option>
              </select>
            </div>
          </div>
          <p class="alert" id="job-alert" role="alert" hidden></p>
          <div class="form-actions">
            <button type="submit" class="btn" id="job-submit">add job</button>
            <button type="button" class="btn btn-hipster" id="job-cancel" hidden>cancel</button>
          </div>
        </form>

        <form class="filters" id="filters">
          <div class="form-row">
            <label for="search" class="form-label">search position</label>
            <input type="search" id="search" name="search" class="form-input" />
          </div>
          <div class="form-row">
            <label for="filter-status" class="form-label">status</label>
            <select id="filter-status" name="status" class="form-input">
              <option value="all">all</option>
              <option value="pending">pending</option>
              <option value="interview">interview</option>
              <option value="declined">declined</option>
            </select>
          </div>
          <div class="form-row">
            <label for="filter-type" class="form-label">job type</label>
            <select id="filter-type" name="jobType" class="form-input">
              <option value="all">all</option>
              <option value="full-time">full-time</option>
              <option value="part-time">part-time</option>
              <option value="remote">remote</option>
              <option value="internship">internship</option>
            </select>
          </div>
          <div class="form-row">
            <label for="sort" class="form-label">sort</label>
            <select id="sort" name="sort" class="form-input">
              <option value="latest">latest</option>
              <option value="oldest">oldest</option>
              <option value="a-z">a-z</option>
              <option value="z-a">z-a</option>
            </select>
          </div>
          <button type="reset" class="btn btn-hipster">clear filters</button>
        </form>

        <p class="jobs-count" id="jobs-count"></p>
        <ul class="jobs" id="jobs-list"></ul>
        <nav class="pagination" id="pagination" aria-label="pagination" hidden>
          <button type="button" class="btn btn-hipster" id="prev-page">prev</button>
          <span id="page-info"></span>
          <button type="button" class="btn btn-hipster" id="next-page">next</button>
        </nav>
      </section>
    </main>
    <script src="./browser-app.js"></script>
  </body>
</html>
